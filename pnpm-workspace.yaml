allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  canvas: false
  core-js: false
  msw: false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - "@iblai/*"
  - icu-minify@4.14.9
  - next-intl-swc-plugin-extractor@4.14.9
  - next-intl@4.14.9
  - use-intl@4.14.9
  - "@next/env@16.4.3"
  - "@next/swc-darwin-arm64@16.4.3"
  - "@next/swc-darwin-x64@16.4.3"
  - "@next/swc-linux-arm64-gnu@16.4.3"
  - "@next/swc-linux-arm64-musl@16.4.3"
  - "@next/swc-linux-x64-gnu@16.4.3"
  - "@next/swc-linux-x64-musl@16.4.3"
  - "@next/swc-win32-arm64-msvc@16.4.3"
  - "@next/swc-win32-x64-msvc@16.4.3"
  - "@shadcn/registry@0.1.3"
  - next@16.4.3
  - shadcn@4.21.4
# One physical copy of each @iblai/* package, hoisted to the root: the SDK's
# React contexts live on the module instance, so a second copy makes its
# RTK Query hooks return undefined.
dedupePeerDependents: true
publicHoistPattern:
  - "@iblai/*"
