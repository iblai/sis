name: Release

# Every push to main releases the web app with release-it: the version bump and
# the CHANGELOG.md entry come from the conventional commit subjects since the
# last v* tag; the release commit, the v<version> tag and the GitHub Release are
# pushed by github-actions[bot] with the built-in token, so they trigger no other
# workflow. The baseline tag is published by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # Skip our own release commits (loop guard).
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Git identity and push credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The baseline tag (v0.1.0) is published by hand; every release here follows a tag.
          if [ -z "$(git ls-remote --tags origin 'refs/tags/v*')" ]; then
            echo "::error::No v* tag on origin yet — publish the baseline tag first (docs/development.md#release)."
            exit 1
          fi
          pnpm release --ci
